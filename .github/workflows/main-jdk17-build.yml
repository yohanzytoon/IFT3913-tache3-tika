name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'yohan', 'zouhair/**', 'validation/**' ]
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Optional ancestor SHA for a cumulative security demonstration'
        required: false
        type: string
      full_build:
        description: 'Run the inherited full build (disable only for a focused manual demonstration)'
        required: false
        default: true
        type: boolean
      proof_expectation:
        description: 'Run controlled proofs with the expected security behavior'
        required: false
        default: skip
        type: choice
        options: [skip, secure, vulnerable]

permissions:
  contents: read

jobs:
  security:
    name: Semgrep — new vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .semgrep/requirements.txt
      - name: Install pinned scanner
        run: python -m pip install -r .semgrep/requirements.txt
      - name: Test gate logic
        run: python -m unittest discover -s scripts/tache3 -p 'test_*.py' -v
      - name: Validate differential scanner behavior
        run: python scripts/tache3/validate_scanner.py --output "$RUNNER_TEMP/scanner-validation"
      - name: Preserve scanner validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scanner-validation/
      - name: Reject new security findings
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline }}
          SEMGREP_ENABLE_VERSION_CHECK: '0'
          SEMGREP_SEND_METRICS: 'off'
        run: |
          args=()
          if [[ -n "$REQUESTED_BASELINE" ]]; then
            args+=(--baseline "$REQUESTED_BASELINE")
          fi
          python scripts/tache3/security_gate.py "${args[@]}" --output "$RUNNER_TEMP/semgrep-report"
      - name: Preserve security evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semgrep-report/
          if-no-files-found: warn

  core-tests:
    name: Tika core — baseline and demonstration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Core tests
        id: tests
        run: mvn -B -pl tika-core -am test
      - name: Controlled security proofs
        if: github.event_name == 'workflow_dispatch' && inputs.proof_expectation != 'skip'
        env:
          EXPECT_VULNERABLE: ${{ inputs.proof_expectation == 'vulnerable' }}
        run: >-
          mvn -B -pl tika-core -am -Dtest=Tache3SecurityProofTest
          -Dsurefire.failIfNoSpecifiedTests=false -Dtache3.demo=true
          -Dtache3.expectVulnerable="$EXPECT_VULNERABLE" test
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: '**/target/surefire-reports/'

  build:
    needs: [ security, core-tests ]
    # Preserve the inherited automatic build after the security gate succeeds.
    # Manual demonstrations may explicitly select only security and core tests.
    if: github.event_name != 'workflow_dispatch' || inputs.full_build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
